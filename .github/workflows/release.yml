name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-musl:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build static musl binary
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive and SHA-256 checksum
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/boxlet" dist/boxlet
          chmod +x dist/boxlet
          tar -C dist -czf "dist/boxlet-${{ matrix.target }}.tar.gz" boxlet
          rm -f dist/boxlet
          (
            cd dist
            sha256sum "boxlet-${{ matrix.target }}.tar.gz" > "boxlet-${{ matrix.target }}.tar.gz.sha256"
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boxlet-${{ matrix.target }}
          path: |
            dist/boxlet-${{ matrix.target }}.tar.gz
            dist/boxlet-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-musl
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify SHA-256 checksums
        working-directory: release-assets
        run: sha256sum -c *.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
