name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      - run: cargo audit

  linux-integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build boxlet binary
        run: cargo build --bin boxlet
      - name: Install BusyBox static binary
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox-static
      - name: Run privileged Boxlet V1 end-to-end verification suite
        run: ./scripts/demo-v1.sh ./target/debug/boxlet
