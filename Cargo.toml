[package]
name = "boxlet"
version = "0.1.0"
edition = "2021"
description = "Minimal Linux OCI-compatible container runtime and programmable execution core"

[dependencies]
clap = { version = "4", features = ["derive"] }
oci-spec = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "hostname", "ioctl", "mount", "poll", "process", "sched", "signal", "user"] }
seccompiler = "0.4"
syscalls = "0.6"

[dev-dependencies]
tempfile = "3"
