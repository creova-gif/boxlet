[package]
name = "boxlet"
version = "0.1.0"
edition = "2021"
description = "Minimal Linux OCI-compatible container runtime and programmable execution core"

[dependencies]
oci-spec = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
